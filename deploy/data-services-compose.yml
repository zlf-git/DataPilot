version: "3.9"

# 数据平台核心服务编排（统一网络 hadoop-net，与 hadoop 四件套互通）
# 修复记录：之前用 docker run -v 在 Git Bash 下创建容器，MSYS 路径转换破坏了挂载参数，
# 导致 Flink 缺 Paimon jar、StarRocks 数据未持久化、Hive Metastore 读不到 hive-site.xml、
# 且网络分裂（Flink 在 flink-net 连不到 Kafka/MySQL/StarRocks）。
# 本次改用 compose 声明，挂载路径与网络统一，不经 shell 转换。
# MySQL 容器（mysql-ai-analysis）保持不动，数据与账号已就绪。

networks:
  hadoop-net:
    external: true

services:
  zookeeper:
    image: docker.m.daocloud.io/library/zookeeper:3.5.10
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    networks:
      - hadoop-net
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka-ai-analysis
    hostname: kafka-ai-analysis
    ports:
      - "9092:9092"   # 容器内 PLAINTEXT（Flink 等容器用 kafka-ai-analysis:9092）
      - "9094:9094"   # 宿主机 EXTERNAL（宿主机用 localhost:9094）
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka-ai-analysis:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-ai-analysis:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - "D:/starrocks/data/kafka-data:/bitnami/kafka/data"
    networks:
      - hadoop-net
    restart: unless-stopped

  flink-jobmanager:
    image: docker.m.daocloud.io/library/flink:1.20.0-scala_2.12-java11
    container_name: flink-jobmanager
    hostname: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 8
    volumes:
      - "D:/starrocks/lib/paimon-flink-1.20-1.0.1.jar:/opt/flink/lib/paimon-flink-1.20-1.0.1.jar"
      - "D:/starrocks/lib/mysql-connector-j-8.0.33.jar:/opt/flink/lib/mysql-connector-j-8.0.33.jar"
      - "D:/starrocks/lib/flink-sql-connector-kafka-3.3.0-1.20.jar:/opt/flink/lib/flink-sql-connector-kafka-3.3.0-1.20.jar"
      - "D:/starrocks/lib/flink-sql-connector-mysql-cdc-3.2.1.jar:/opt/flink/lib/flink-sql-connector-mysql-cdc-3.2.1.jar"
      - "D:/starrocks/lib/flink-sql-connector-hive-3.1.3_2.12-1.20.0.jar:/opt/flink/lib/flink-sql-connector-hive-3.1.3_2.12-1.20.0.jar"
      - "D:/starrocks/lib/hadoop-client-api-3.3.3.jar:/opt/flink/lib/hadoop-client-api-3.3.3.jar"
      - "D:/starrocks/lib/hadoop-client-runtime-3.3.3.jar:/opt/flink/lib/hadoop-client-runtime-3.3.3.jar"
      - "D:/starrocks/lib/commons-logging-1.2.jar:/opt/flink/lib/commons-logging-1.2.jar"
    networks:
      - hadoop-net
    restart: unless-stopped

  flink-taskmanager:
    image: docker.m.daocloud.io/library/flink:1.20.0-scala_2.12-java11
    container_name: flink-taskmanager
    hostname: flink-taskmanager
    command: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 8
    volumes:
      - "D:/starrocks/lib/paimon-flink-1.20-1.0.1.jar:/opt/flink/lib/paimon-flink-1.20-1.0.1.jar"
      - "D:/starrocks/lib/mysql-connector-j-8.0.33.jar:/opt/flink/lib/mysql-connector-j-8.0.33.jar"
      - "D:/starrocks/lib/flink-sql-connector-kafka-3.3.0-1.20.jar:/opt/flink/lib/flink-sql-connector-kafka-3.3.0-1.20.jar"
      - "D:/starrocks/lib/flink-sql-connector-mysql-cdc-3.2.1.jar:/opt/flink/lib/flink-sql-connector-mysql-cdc-3.2.1.jar"
      - "D:/starrocks/lib/flink-sql-connector-hive-3.1.3_2.12-1.20.0.jar:/opt/flink/lib/flink-sql-connector-hive-3.1.3_2.12-1.20.0.jar"
      - "D:/starrocks/lib/hadoop-client-api-3.3.3.jar:/opt/flink/lib/hadoop-client-api-3.3.3.jar"
      - "D:/starrocks/lib/hadoop-client-runtime-3.3.3.jar:/opt/flink/lib/hadoop-client-runtime-3.3.3.jar"
      - "D:/starrocks/lib/commons-logging-1.2.jar:/opt/flink/lib/commons-logging-1.2.jar"
    networks:
      - hadoop-net
    restart: unless-stopped

  starrocks:
    image: starrocks/allin1-ubuntu:3.3.8
    container_name: sr-ai-analysis
    hostname: sr-ai-analysis
    ports:
      - "9030:9030"   # FE 查询端口（MySQL 协议）
      - "8030:8030"   # FE HTTP
      - "8040:8040"   # BE HTTP
    volumes:
      - "D:/starrocks/data/starrocks/fe-meta:/data/deploy/starrocks/fe/meta"
      - "D:/starrocks/data/starrocks/be-storage:/data/deploy/starrocks/be/storage"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - hadoop-net
    restart: unless-stopped

  hive-metastore:
    image: docker.m.daocloud.io/apache/hive:3.1.3
    container_name: hive-metastore
    hostname: hive-metastore
    ports:
      - "9083:9083"
    environment:
      - SERVICE_NAME=metastore
      - DB_DRIVER=mysql
      - IS_RESUME=true
    volumes:
      - "D:/starrocks/hadoop-conf/hive-site.xml:/opt/hive/conf/hive-site.xml"
      - "D:/starrocks/lib/mysql-connector-j-8.0.33.jar:/opt/hive/lib/mysql-connector-j-8.0.33.jar"
    networks:
      - hadoop-net
    restart: unless-stopped
