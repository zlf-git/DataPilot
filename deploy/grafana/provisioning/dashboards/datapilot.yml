apiVersion: 1

# 面板自动装载：容器启动就从 /var/lib/grafana/dashboards 读 JSON，
# 改面板 = 改仓库里的 JSON + 重启 grafana 容器，不靠人手在 UI 里点（点出来的东西进不了 Git）。
providers:
  - name: DataPilot
    orgId: 1
    folder: DataPilot
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
