# DataPilot 平台入口（8080）
#
# 为什么把 8080 从 go-view 换成这个：go-view 的编辑器依赖 go-view-server（Go 后端），
# 本机只托管了它的静态 dist，打开就是登录页且登录接口没人实现 —— 等于一个进不去的空壳。
# 经营大屏改成 DataPilot 自建页面（React + 手写 SVG），这里只负责三件事：
#   1. 托管 frontend/dist（SPA，history 路由回退到 index.html）
#   2. 把 /api 反代到宿主机上的 Spring Boot 后端（容器内访问宿主机走 host-gateway）
#   3. 把 /report-assets 反代到后端（问数报告的图表库，见下）
#
# 静态目录是**直接挂宿主机 build 产物**，所以前端重新构建后刷新页面即可，不用重启容器。
#
# 挂载方式（deploy/platform-ui-compose.yml 的 dp-web 段）：
#   ${DP_DIST:-<repo>/frontend/dist} → /usr/share/nginx/html:ro
#   deploy/dp-web/nginx.conf         → /etc/nginx/conf.d/default.conf:ro
# 首次部署请把本文件拷到挂载点（例如 D:/starrocks/dp-web/nginx.conf）后再起容器。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 后端反代：容器内 host.docker.internal 由 compose 的 extra_hosts 映射到宿主机
    location /api/ {
        proxy_pass http://host.docker.internal:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 8m;
    }

    # 问数报告的图表库（Ticket 18）。
    # reportHtml 是塞进 iframe srcdoc 的完整 HTML，里面的相对路径按**父页面 origin**（就是本 8080）解析，
    # 所以 /report-assets/echarts.min.js 会打到 nginx。不代理这一条，报告里的图仍然空白
    # —— 后端本地化了文件，但浏览器根本取不到。
    #
    # 必须是 `^~` 而不是普通前缀：下面那条 `~* \.(js|css|...)$` 是**正则** location，
    # nginx 的优先级是「正则 > 普通前缀」，写成 `location /report-assets/` 时
    # echarts.min.js 会先被正则接走、按静态文件去找 → 404（实测过）。
    location ^~ /report-assets/ {
        proxy_pass http://host.docker.internal:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 1MB 的静态库：让浏览器缓存住，不必每次问数都重下
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA 路由回退：/ask、/dashboard 这些前端路由在磁盘上没有对应文件
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location ~ /\. {
        deny all;
    }
}
