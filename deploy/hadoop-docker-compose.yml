version: "3"

x-hadoop-common: &hadoop-common
  image: docker.m.daocloud.io/apache/hadoop:3
  restart: unless-stopped
  networks:
    - hadoop-net
  volumes:
    - "D:/starrocks/hadoop-conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml"
    - "D:/starrocks/hadoop-conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml"
    - "D:/starrocks/hadoop-conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml"
    - "D:/starrocks/hadoop-conf/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml"

services:
  namenode:
    <<: *hadoop-common
    hostname: namenode
    container_name: hadoop-namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
      ENSURE_NAMENODE_CLUSTERID: "cluster-1"
    command: ["hdfs", "namenode"]

  datanode:
    <<: *hadoop-common
    hostname: datanode
    container_name: hadoop-datanode
    ports:
      - "9864:9864"
      - "9866:9866"
    command: ["hdfs", "datanode"]

  resourcemanager:
    <<: *hadoop-common
    hostname: resourcemanager
    container_name: hadoop-resourcemanager
    ports:
      - "8088:8088"
    command: ["yarn", "resourcemanager"]

  nodemanager:
    <<: *hadoop-common
    hostname: nodemanager
    container_name: hadoop-nodemanager
    ports:
      - "8042:8042"
    command: ["yarn", "nodemanager"]

networks:
  hadoop-net:
    name: hadoop-net
