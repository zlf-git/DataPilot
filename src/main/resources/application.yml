server:
  port: 8080

spring:
  datasource:
    # 元数据库（存语义模型/字段/指标/术语/few-shot/AgentOps，固定用 MySQL，端口 3307）
    url: jdbc:mysql://localhost:3307/data_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_META_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    openai:
      # DeepSeek 走 OpenAI 兼容协议；base-url 不要加 /v1，Spring AI 会自动补全路径
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.0

datapilot:
  # 可插拔的业务数据执行引擎（数据源轴）
  engine:
    # 业务数据引擎：starrocks（业务数据在 mall_dw，只读账号 agent_ro）
    type: starrocks
    url: jdbc:mysql://localhost:9030/mall_dw?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: agent_ro
    password: ${STARROCKS_AGENT_PASSWORD:AgentRo@2026}
    # 引擎侧连接池大小（执行与时间锚点查询共用；此前无池化，每条 SQL 新建一条 TCP）
    pool-size: 5
    # 时间锚点（数据 MAX(dt)）缓存 TTL 秒，按表缓存；数据日更时 60s 足够
    anchor-ttl-seconds: 60

  # LLM：provider 决定装配桩(stub)还是真模型(deepseek)；真实 provider 的连接信息走 spring.ai.openai.*
  llm:
    provider: stub   # stub / deepseek

  # Embedding（OpenAI 兼容，Qwen text-embedding-v3，1024 维）
  embedding:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${QWEN_API_KEY:sk-在这里填你的key}
    model: text-embedding-v3

  # Milvus 向量库（enabled=false 时 Recaller 降级纯关键词召回）
  milvus:
    enabled: false
    host: localhost
    port: 19530

  # LLM 成本单价（元/百万 token），AgentOps 成本计算用，可按实际价格调整
  cost:
    input-price-per-million: 1.0
    output-price-per-million: 2.0

  # 元数据写接口开关（Ticket 14 落地鉴权前，写接口默认关；本地演示置 true 才允许 PUT）
  metadata:
    write-enabled: false
